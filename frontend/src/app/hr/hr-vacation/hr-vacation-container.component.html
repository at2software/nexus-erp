@let _currentUser = currentUser();
@if (_currentUser) {
    <hr-vacation [user]="_currentUser" [isHr]="true"></hr-vacation>
    
    <button type="button" class="float-end btn btn-primary" (click)="onAddGrant()" ngbTooltip="CTRL+ALT+G" placement="bottom" hotkey="CTRL+ALT+G">
        <i>add</i>
        <span i18n="@@i18n.hr.leaveAllowance">leave allowance</span>
    </button>
}
