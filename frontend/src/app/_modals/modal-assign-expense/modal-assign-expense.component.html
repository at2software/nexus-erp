@let _filtered = filtered();
<div class="modal-header">
    <span class="modal-title" i18n="@@i18n.invoices.assignToExpense">assign to expense</span>
    <button type="button" class="btn-close" aria-label="Close" (click)="decline()"></button>
</div>
<div class="modal-body p-0">
    <div class="p-3 border-bottom">
        <div class="text-muted small mb-2">pattern: <strong>{{ pattern() }}</strong></div>
        <input class="form-control" i18n-placeholder="@@i18n.invoices.filterExpenses" placeholder="filter expenses…" [ngModel]="filter()" (ngModelChange)="filter.set($event)" />
    </div>
    <ul class="list-group list-group-flush">
        @for (exp of _filtered; track exp.id) {
            <li class="list-group-item list-group-item-action" style="cursor:pointer" tabindex="0" (click)="pick(exp)" (keyup.enter)="pick(exp)">
                <div class="hstack gap-2">
                    <span>{{ exp.name }}</span>
                    <span class="ms-auto text-muted small">€ {{ exp.price }}</span>
                </div>
            </li>
        }
        @if (_filtered.length === 0) {
            <li class="list-group-item text-muted text-center" i18n="@@i18n.invoices.noExpensesFound">no expenses found</li>
        }
    </ul>
</div>
